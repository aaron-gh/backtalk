name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The full history gives the build number (the commit count) and the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      # Signs builds with the same debug key as the maintainer's own builds, so that installed
      # development builds can update in place. Pull requests from forks do not get the secret,
      # so they are signed with a new debug key.
      - name: Install debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "Installed the debug keystore."
          else
            echo "No debug keystore secret, so the build uses a new debug key."
          fi

      # AGP downloads the SDK platform and NDK it needs if the runner lacks them.
      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Replaces the rolling "latest" pre-release that the in-app updater checks. The first line of the
  # notes is "build: <commit count>", and each later line is "- <short hash> <subject>", newest
  # first.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          hash=$(git rev-parse HEAD)
          short=${hash:0:7}
          {
            echo "build: $count"
            echo
            # %H cut to 7 characters, since %h can be longer when a short hash is ambiguous.
            git log -n 50 --format='%H %s' HEAD | while IFS= read -r line; do
              echo "- ${line:0:7} ${line:41}"
            done
          } > release-notes.md
          apk=$(find apks -name backtalk-phone-debug.apk | head -n 1)
          if [ -z "$apk" ]; then
            echo "Phone APK not found." >&2
            exit 1
          fi
          cp "$apk" backtalk.apk
          title="Development build $count ($short)"
          if gh release view latest > /dev/null 2>&1; then
            # Update the release in place. Deleting and creating it again counts as a new release,
            # which notifies everyone watching the repository.
            git tag -f latest "$GITHUB_SHA"
            git push -f origin refs/tags/latest
            gh release upload latest backtalk.apk --clobber
            gh release edit latest --title "$title" --notes-file release-notes.md --prerelease
          else
            gh release create latest backtalk.apk --prerelease --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md
          fi
