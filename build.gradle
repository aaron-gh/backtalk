// For building the open-source release of TalkBack.

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.compose) apply false
}

apply from: 'shared.gradle'

apply from: 'version.gradle'

final BUILD_TIMESTAMP = new Date().format('yyyy_MM_dd_HHmm')

dependencies {
    implementation project(':talkback')
}

android {
    namespace = "com.android.talkback"
    defaultConfig {
        applicationId = talkbackApplicationId
        versionCode = backtalkVersionCodeBase + gitCommitCount
        versionName = talkbackVersionName + "-" + BUILD_TIMESTAMP
        minSdk = 26
        targetSdk = 36
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
        multiDexEnabled = true
    }
    buildTypes {
        // The published builds are debug builds, signed with the debug key. Android runs a
        // debuggable app without compiling it, which makes navigation several times slower on
        // a watch, so they are not debuggable. Debug logging in the libraries stays on.
        debug {
            debuggable = false
        }
    }
    packaging {
        resources {
            excludes += ['LICENSE', 'README']
        }
        jniLibs {
            // On-device AI only runs on arm64-v8a (see OnDeviceAiSettings), so its 26 MB library
            // would never load on x86_64.
            excludes += ['lib/x86_64/liblitertlm_jni.so']
        }
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
    productFlavors {
        phone {
            dimension = "target"
        }
        wear {
            dimension = "target"
            versionNameSuffix = "-wear"
        }
    }
}
